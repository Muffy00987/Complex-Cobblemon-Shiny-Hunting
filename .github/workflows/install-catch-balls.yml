name: Install Catch Ball Panel

on:
  push:
    paths:
      - '.github/workflows/install-catch-balls.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add catch ball script to homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<script src="app.js" defer></script>'
          new = old + '<script src="catch-balls.js" defer></script>'
          if 'src="catch-balls.js"' not in s:
              if old not in s:
                  raise SystemExit('app.js script tag not found')
              p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit homepage hook
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load Poké Ball recommendation panel"
          git push
